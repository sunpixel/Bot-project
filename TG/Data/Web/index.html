<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Cart</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="cart">
    <div class="cart-item">
      <div class="item-name">Apple</div>
      <div class="item-details">Qty: 3<br>$6.00</div>
    </div>
    <div class="cart-item">
      <div class="item-name">Banana</div>
      <div class="item-details">Qty: 5<br>$5.00</div>
    </div>
    <div class="cart-item">
      <div class="item-name">Orange</div>
      <div class="item-details">Qty: 2<br>$4.00</div>
    </div>

    <div class="total">Total: $15.00</div>

    <button class="place-order" onclick="placeOrder()">Place Order</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
